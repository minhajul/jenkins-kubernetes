apiVersion: apps/v1
kind: Deployment
metadata:
  name: nestjs-app
  namespace: devops-tools
  labels:
    app: nestjs-app
    app.kubernetes.io/name: nestjs-app
    app.kubernetes.io/part-of: devops-tools
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nestjs-app
  template:
    metadata:
      labels:
        app: nestjs-app
        app.kubernetes.io/name: nestjs-app
        app.kubernetes.io/part-of: devops-tools
        app.kubernetes.io/managed-by: kubectl
    spec:
      serviceAccountName: nestjs-app-sa
      containers:
        - name: nestjs-app
          image: nestjs-k8s-app:latest  # overridden by CI/CD to :build-<number>
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: production
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3