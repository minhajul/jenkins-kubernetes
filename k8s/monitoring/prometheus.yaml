apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-sa
  namespace: devops-tools
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-role
rules:
  - apiGroups: [ "" ]
    resources: [ "nodes", "nodes/proxy", "services", "endpoints", "pods" ]
    verbs: [ "get", "list", "watch" ]
  - apiGroups: [ "extensions", "networking.k8s.io" ]
    resources: [ "ingresses" ]
    verbs: [ "get", "list", "watch" ]
  - nonResourceURLs: [ "/metrics" ]
    verbs: [ "get" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-rolebinding
subjects:
  - kind: ServiceAccount
    name: prometheus-sa
    namespace: devops-tools
roleRef:
  kind: ClusterRole
  name: prometheus-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: devops-tools
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: [ 'localhost:9090' ]

      - job_name: 'nestjs-app'
        metrics_path: '/metrics'
        static_configs:
          - targets: [ 'nestjs-app-service:3000' ]

      - job_name: 'jenkins'
        metrics_path: '/prometheus/'
        static_configs:
          - targets: [ 'jenkins-service:8080' ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-server
  namespace: devops-tools
  labels:
    app: prometheus-server
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: devops-tools
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-server
  template:
    metadata:
      labels:
        app: prometheus-server
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: devops-tools
        app.kubernetes.io/managed-by: kubectl
      # Bump this hash when prometheus-config changes to trigger a rollout
      # (see `make prometheus-reload`). Also requires --web.enable-lifecycle.
      annotations:
        checksum/config: f6659775cf54d58e47d342f61079e1867d9d7e6a1cec2da01f2b517563dc806c
    spec:
      serviceAccountName: prometheus-sa
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
            - name: storage-volume
              mountPath: /prometheus
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
        - name: storage-volume
          persistentVolumeClaim:
            claimName: prometheus-pv-claim
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pv-claim
  namespace: devops-tools
spec:
  # Uses the cluster default StorageClass (local-path on this cluster).
  # Pin `storageClassName:` explicitly if the cluster has multiple SCs.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: devops-tools
  labels:
    app: prometheus-server
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: devops-tools
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  selector:
    app: prometheus-server
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      protocol: TCP
